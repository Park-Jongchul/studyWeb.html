.menu-path{display:grid;gap:12px;margin:22px 0}.menu-path>div{padding:14px;border:1px solid #a7c7b7;background:#f0f6f1;border-radius:8px;font-size:18px}.menu-path>div>span{display:inline-block;border-radius:50%;background:#0c6b61;color:white;text-align:center;width:30px;height:30px;line-height:30px;margin-right:12px;font-weight:700}@media(max-width:480px){.menu-path>div{font-size:16px;padding:10px}}</style></head><body><main style="margin:auto"><a href="index.html">자료 홈</a><h1>개발툴 그림 따라 하기</h1><p>위에서 아래로 한 단계씩 따라 하세요. 공식 실제 화면과 교재용 키보드 그림은 각 카드에 구분했습니다. 이미지의 큰 안내문에 클릭할 곳과 완료 표시를 함께 적었습니다.</p><figure class="tool-card schematic"><figcaption><span class="step-num">S1</span><strong>VS Code 공식 다운로드 페이지 열기</strong></figcaption><div class="menu-path"><div><span>1</span>브라우저에서 https://code.visualstudio.com/download 열기</div><div><span>2</span>Windows PC → Windows의 User Installer 선택 / Mac → Mac 다운로드 선택</div><div><span>3</span>받은 파일은 파일 탐색기 또는 Finder의 다운로드 폴더에서 찾기</div></div><p class="success"><b>완료 확인</b> VSCodeUserSetup…exe(Windows) 또는 VSCode…zip(Mac) 파일이 다운로드 폴더에 있어요.</p><p class="credit">클릭 순서를 단순화한 교재용 그림입니다. 실제 서비스 화면 캡처는 아닙니다. 실제 화면에서는 같은 메뉴 이름을 찾아가세요.</p></figure><figure class="tool-card schematic"><figcaption><span class="step-num">S2</span><strong>Windows: 다운로드한 설치 파일 실행하기</strong></figcaption><div class="menu-path"><div><span>1</span>다운로드 폴더에서 VSCodeUserSetup…exe 더블클릭</div><div><span>2</span>약관을 읽고 동의하는 경우 동의 → Next(다음)</div><div><span>3</span>설치 위치·시작 메뉴는 기본값 → 추가 작업의 Add to PATH 기본 선택 유지</div><div><span>4</span>Install(설치) → 완료될 때까지 기다리기</div><div><span>5</span>Launch Visual Studio Code 선택 → Finish(마침)</div></div><p class="success"><b>완료 확인</b> 파란 아이콘의 Visual Studio Code 창이 열립니다. 설치 파일을 다시 여는 대신 시작 메뉴에서 Visual Studio Code를 검색해 실행할 수 있어요.</p><p class="credit">클릭 순서를 단순화한 교재용 그림입니다. 실제 서비스 화면 캡처는 아닙니다. 실제 화면에서는 같은 메뉴 이름을 찾아가세요.</p></figure><figure class="tool-card schematic"><figcaption><span class="step-num">S3</span><strong>Mac: ZIP을 풀고 응용 프로그램에 넣기</strong></figcaption><div class="menu-path"><div><span>1</span>Finder → 다운로드 → VSCode…zip 더블클릭</div><div><span>2</span>풀린 Visual Studio Code.app을 Applications(응용 프로그램) 폴더로 드래그</div><div><span>3</span>Finder → 응용 프로그램 → Visual Studio Code 더블클릭</div><div><span>4</span>인터넷에서 받은 앱 확인창이 나오면 출처를 확인하고 열기</div></div><p class="success"><b>완료 확인</b> VS Code 창이 열리고 응용 프로그램 폴더에 앱이 있습니다. ZIP 파일 자체를 Dock에 넣지 마세요.</p><p class="credit">클릭 순서를 단순화한 교재용 그림입니다. 실제 서비스 화면 캡처는 아닙니다. 실제 화면에서는 같은 메뉴 이름을 찾아가세요.</p></figure><figure class="tool-card key-card"><figcaption><span class="step-num">W1</span><strong>바탕화면에 작업 폴더 만들기</strong></figcaption><div class="keyboard"><kbd>새 폴더</kbd><kbd>counseling-practice</kbd></div><p class="action">Windows 바탕화면 빈 곳 우클릭 → 새로 만들기 → 폴더. 이름을 counseling-practice로 적어요. macOS는 Finder에서 파일 → 새로운 폴더를 사용해요.</p><p class="success"><b>완료 확인</b> 빈 counseling-practice 폴더가 하나 생겼어요.</p><p class="credit">키보드 조작을 설명하는 교재용 그림입니다. 실제 프로그램 화면 캡처는 아닙니다.</p></figure><figure class="tool-card" data-guide="vscode-folder-opened"><figcaption><span class="step-num">W2</span><strong>File → Open Folder로 그 폴더 열기</strong></figcaption><p class="action"><b>할 일</b> VS Code 위쪽 File → Open Folder… → 방금 만든 counseling-practice 선택 → Select Folder(맥은 Open).</p><div class="shot"><img src="study-assets/a22e87cbbef17921430b.png" alt="File → Open Folder로 그 폴더 열기: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 왼쪽 Explorer 위에 COUNSELING-PRACTICE가 보여요. 공식 예시 그림의 VSCODE101은 폴더 이름 예시입니다.</p><p>직접 만든 빈 폴더에서 Workspace Trust 질문이 나오면 그 폴더임을 확인하고 신뢰를 선택하세요. 다른 출처의 작업 폴더는 내용을 확인한 뒤 결정합니다.</p><p class="credit">원본 화면: <a href="https://code.visualstudio.com/docs/editing/getting-started/editor-tutorial">Microsoft VS Code 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="explorer-new-file"><figcaption><span class="step-num">W3</span><strong>왼쪽 새 파일 아이콘 누르기</strong></figcaption><p class="action"><b>할 일</b> 왼쪽 종이 두 장 모양 Explorer를 누르고, 폴더 이름 줄의 종이+ 아이콘(New File)을 눌러요.</p><div class="shot"><img src="study-assets/51b86c6078e61329382e.png" alt="왼쪽 새 파일 아이콘 누르기: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 폴더 아래에 파일 이름을 적는 칸이 열려요.</p><p class="credit">원본 화면: <a href="https://code.visualstudio.com/docs/editing/getting-started/editor-tutorial">Microsoft VS Code 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="new-file-editor"><figcaption><span class="step-num">W4</span><strong>index.html 입력 → Enter</strong></figcaption><p class="action"><b>할 일</b> 파일 이름 칸에 index.html을 정확히 적고 Enter. 오른쪽 빈 편집 영역에 이 장의 첫 HTML 코드를 넣어요.</p><div class="shot"><img src="study-assets/f2441f55b37622c07f54.png" alt="index.html 입력 → Enter: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 상단 탭과 왼쪽 목록에 index.html이 보여요. index.html.txt가 아니어야 합니다.</p><p class="credit">원본 화면: <a href="https://code.visualstudio.com/docs/editing/getting-started/editor-tutorial">Microsoft VS Code 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card key-card"><figcaption><span class="step-num">W5</span><strong>작성한 파일 저장</strong></figcaption><div class="keyboard"><kbd>Ctrl</kbd><kbd>S</kbd></div><p class="action">Windows는 Ctrl+S, macOS는 ⌘+S. 코드를 바꿀 때마다 저장해요.</p><p class="success"><b>완료 확인</b> 탭 이름 옆의 미저장 점이 사라져요. 코드를 저장한 것이고, 아직 브라우저 화면을 새로 그린 것은 아닙니다.</p><p class="credit">키보드 조작을 설명하는 교재용 그림입니다. 실제 프로그램 화면 캡처는 아닙니다.</p></figure><figure class="tool-card key-card"><figcaption><span class="step-num">W6</span><strong>브라우저에서 파일 열기</strong></figcaption><div class="keyboard"><kbd>Chrome</kbd><kbd>Ctrl + O</kbd><kbd>index.html</kbd></div><p class="action">Chrome을 열고 Ctrl+O(맥은 ⌘+O) → counseling-practice 안의 index.html 선택 → 열기. 또는 파일 탐색기에서 index.html을 두 번 눌러요.</p><p class="success"><b>완료 확인</b> 코드 대신 큰 제목과 소개 문장이 보이면 성공입니다.</p><p class="credit">키보드 조작을 설명하는 교재용 그림입니다. 실제 프로그램 화면 캡처는 아닙니다.</p></figure><figure class="tool-card key-card"><figcaption><span class="step-num">W7</span><strong>고친 화면 확인</strong></figcaption><div class="keyboard"><kbd>VS Code: 저장</kbd><kbd>Chrome: 새로고침</kbd></div><p class="action">HTML 제목 한 글자 변경 → Ctrl+S → 브라우저로 이동 → 새로고침 버튼 또는 Ctrl+R(맥은 ⌘+R).</p><p class="success"><b>완료 확인</b> 바꾼 글자가 브라우저에 나타납니다. 이전 화면이면 파일 경로와 저장 여부를 먼저 확인하세요.</p><p class="credit">키보드 조작을 설명하는 교재용 그림입니다. 실제 프로그램 화면 캡처는 아닙니다.</p></figure><figure class="tool-card" data-guide="gh-quick-0"><figcaption><span class="step-num">P1</span><strong>GitHub 가입·로그인 → New repository</strong></figcaption><p class="action"><b>할 일</b> github.com에서 본인 계정으로 로그인한 뒤 오른쪽 위 + → New repository. 저장소는 파일과 수정 이력을 모아 둘 공간이에요.</p><div class="shot"><img src="study-assets/f1c0f1b3c2bdcb9026c6.png" alt="GitHub 가입·로그인 → New repository: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 새 저장소 이름을 적는 화면이 열려요.</p><p class="credit">원본 화면: <a href="https://docs.github.com/en/pages/quickstart">GitHub Docs</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="gh-quick-1"><figcaption><span class="step-num">P2</span><strong>저장소 이름은 내계정.github.io</strong></figcaption><p class="action"><b>할 일</b> Repository name에 본인 GitHub 사용자 이름.github.io를 적어요. 예: 사용자 이름 mindlearner면 mindlearner.github.io. Public 선택, Add README 켜기 → Create repository.</p><div class="shot"><img src="study-assets/6fe37f6abe15ba2378c9.png" alt="저장소 이름은 내계정.github.io: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 내계정.github.io 저장소가 열려요. 공식 그림의 octocat은 예시 이름이고 여러분 계정으로 바꿔야 해요.</p><p class="credit">원본 화면: <a href="https://docs.github.com/en/pages/quickstart">GitHub Docs</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="gh-upload-0"><figcaption><span class="step-num">P3</span><strong>Add file → Upload files</strong></figcaption><p class="action"><b>할 일</b> 저장소의 Code 탭 rce에서 Deploy from a branch 선택 → Branch: main → Folder: /(root) → Save. 실제 브랜치 이름이 다르면 파일이 있는 브랜치를 고르세요.</p><div class="shot"><img src="study-assets/70a3a20b7a5d5a810e6e.png" alt="Deploy from a branch → main → /(root) → Save: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> Pages 설정에 배포 상태와 Visit site 주소가 생겨요. 최초 공개와 수정 반영은 몇 분, 경우에 따라 약 10분 걸릴 수 있어요.</p><p class="credit">원본 화면: <a href="https://docs.github.com/en/pages/quickstart">GitHub Docs</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card schematic"><figcaption><span class="step-num">D1</span><strong>가비아에서 원하는 주소 검색</strong></figcaption><div class="menu-path"><div><span>1</span>gabia.com → 회원가입 또는 로그인</div><div><span>2</span>상단 도메인 → 도메인 검색</div><div><span>3</span>원하는 이름과 .com 등 종류 입력 → 검색</div><div><span>4</span>등록 가능한 이름을 선택 → 신청하기</div></div><p class="success"><b>완료 확인</b> 내가 등록하려는 철자와 도메인 종류가 신청 목록에 정확히 표시돼요.</p><p class="credit">클릭 순서를 단순화한 교재용 그림입니다. 실제 서비스 화면 캡처는 아닙니다. 실제 화면에서는 같은 메뉴 이름을 찾아가세요.</p></figure><figure class="tool-card schematic"><figcaption><span class="step-num">D2</span><strong>등록 정보 입력과 완료 확인</strong></figcaption><div class="menu-path"><div><span>1</span>도메인 철자·기간 확인</div><div><span>2</span>소유자·관리자 정보와 연락 가능한 이메일 입력</div><div><span>3</span>요청되는 이메일·연락처 인증 완료</div><div><span>4</span>네임서버는 가비아 기본값 사용. 불필요한 추가 호스팅 선택은 해제</div><div><span>5</span>약관·총금액 확인 후 본인이 결제</div><div><span>6</span>My가비아에서 도메인 등록 완료·만료일 확인</div></div><p class="success"><b>완료 확인</b> 본인 관리 목록에 새 도메인이 나타나요. 등록이 끝났어도 아직 사이트는 연결 전일 수 있습니다.</p><p class="credit">클릭 순서를 단순화한 교재용 그림입니다. 실제 서비스 화면 캡처는 아닙니다. 실제 화면에서는 같은 메뉴 이름을 찾아가세요.</p></figure><figure class="tool-card" data-guide="gh-verify-0"><figcaption><span class="step-num">C1</span><strong>개인 Settings → Pages → Add a domain</strong></figcaption><p class="action"><b>할 일</b> 오른쪽 위 프로필 사진 → Settings → 왼쪽 Pages → Add a domain → example.com 대신 자신의 루트 도메인 입력. 이 단계는 개인 계정 설정입니다.</p><div class="shot"><img "shot"><img src="study-assets/dae35a7e8d8287cbcf47.png" alt="Welcome 화면 → New Project: 공식 개발 도구 화면 예시" loading="lazy"><span class="click-target" aria-hidden="true" style="left:1%;top:14%;width:17%;height:10%"><span>여기를 선택</span></span></div><p class="success"><b>완료 확인</b> New Project라는 제목의 템플릿 선택 창이 열려요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/projects/create-project">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="new-project-templates"><figcaption><span class="step-num">A2</span><strong>Phone and Tablet → Empty Views Activity → Next</strong></figcaption><p class="action"><b>할 일</b> 왼쪽 Phone and Tablet 선택 → 오른쪽 아래쪽의 Empty Views Activity 선택 → 오른쪽 아래 Next. 그림의 선택 테두리 대신 이 교재의 빨간 안내 상자를 따라가세요.</p><div class="shot"><img src="study-assets/cc8b33e2e8d7abcde459.png" alt="Phone and Tablet → Empty Views Activity → Next: 공식 개발 도구 화면 예시" loading="lazy"><span class="click-target" aria-hidden="true" style="left:75%;top:39%;width:23%;height:31%"><span>여기를 선택</span></span></div><p class="success"><b>완료 확인</b> 다음 화면의 템플릿 이름이 Empty Views Activity인지 확인하세요.</p><p>Views라는 단어가 중요해요. 목록에서 안 보이면 아래로 스크롤하거나 템플릿 검색을 사용하세요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/projects/create-project">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="new-project-wizard-configure-2x"><figcaption><span class="step-num">A3</span><strong>앱 이름·패키지·언어 입력 → Finish</strong></figcaption><p class="action"><b>할 일</b> Name: BeautyStart / Package name: com.example.beautystart / Save location: 기본 개인 작업 폴더 / Language: Kotlin / Minimum SDK: API 24 이상인 기본값 → Finish.</p><div class="shot"><img src="study-assets/3e4ea68aba953e59773a.png" alt="앱 이름·패키지·언어 입력 → Finish: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> BeautyStart 프로젝트 창이 열리고 아래쪽에서 Gradle 준비가 진행돼요.</p><p>이 원본은 Basic Activity의 입력 항목 예시입니다. 여러분의 창 제목은 Empty Views Activity여야 해요. 그림의 My Application·API 21 값을 그대로 옮기지 말고 위 교재 값을 입력하세요. 최신 버전에 없는 Legacy 체크 항목은 찾지 않아도 됩니다.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/projects/create-project">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="tools-new-device-manager"><figcaption><span class="step-num">A4</span><strong>View → Tool Windows → Device Manager</strong></figcaption><p class="action"><b>할 일</b> 프로젝트가 열린 상태에서 View → Tool Windows → Device Manager를 순서대로 누르세요. 버전에 따라 Tools → Device Manager에도 있어요.</p><div class="shot"><img src="study-assets/b975b5f94899a7384fa6.png" alt="View → Tool Windows → Device Manager: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 가상 기기 목록 또는 기기를 만들 수 있는 패널이 열려요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run/managing-avds">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="device-manager"><figcaption><span class="step-num">A5</span><strong>+ 또는 Create Virtual Device 누르기</strong></figcaption><p class="action"><b>할 일</b> Device Manager에서 + 또는 Create Virtual Device를 눌러요. 이미 있는 일반 Phone 기기가 있으면 선택해 사용할 수 있어요.</p><div class="shot"><img src="study-assets/f3631f0badfe97f7936c.png" alt="+ 또는 Create Virtual Device 누르기: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> Select Hardware 또는 기기 구성 창이 열려요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run/managing-avds">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="select-hardware-window"><figcaption><span class="step-num">A6</span><strong>Phone 기기 선택 → 다음</strong></figcaption><p class="action"><b>할 일</b> Phone 분류 → 일반 Pixel Phone 하나 선택 → Next. 특정 모델 이름을 똑같이 맞출 필요는 없어요.</p><div class="shot"><img src="study-assets/7f4ba25df52964c080c3.png" alt="Phone 기기 선택 → 다음: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 선택한 가상 폰에 설치할 시스템 이미지를 고르는 단계로 넘어가요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run/managing-avds">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="system-image-device-configuration"><figcaption><span class="step-num">A7</span><strong>시스템 이미지 다운로드·선택</strong></figcaption><p class="action"><b>할 일</b> 현재 안정 Android 버전의 권장 이미지를 선택해요. 다운로드 표시가 있으면 누르고 라이선스 확인 후 완료를 기다립니다. 기기 CPU와 맞는 Studio 권장 이미지를 사용하세요.</p><div class="shot"><img src="study-assets/18a7e7e3798dfac6fc45.png" alt="시스템 이미지 다운로드·선택: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 다운로드가 끝난 이미지를 선택한 채 다음 단계로 진행할 수 있어요.</p><p>최근 Studio는 이 설정을 한 창으로 합쳐 보여 줄 수 있어요. 다운로드가 끝났다는 표시를 확인하고 다음 또는 Finish로 진행하세요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run/managing-avds">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="verify-configuration"><figcaption><span class="step-num">A8</span><strong>가상 기기 설정 확인 → Finish</strong></figcaption><p class="action"><b>할 일</b> 기기 이름과 선택한 시스템 이미지를 확인한 뒤 Finish. Device Manager 목록에서 해당 기기의 재생(▶) 버튼을 눌러 가상 폰을 켭니다.</p><div class="shot"><img src="study-assets/7ced12840ee6020f918d.png" alt="가상 기기 설정 확인 → Finish: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> 잠금 화면 또는 홈 화면이 보이는 가상 폰이 시작돼요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run/managing-avds">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="deploy-run-app-new-ui"><figcaption><span class="step-num">A9</span><strong>실행 구성 app → 기기 선택 → Run ▶</strong></figcaption><p class="action"><b>할 일</b> 상단 실행 구성이 app인지 확인 → 기기 목록에서 만든 Phone 선택 → app 오른쪽의 삼각형 Run을 한 번 눌러요.</p><div class="shot"><img src="study-assets/0da003265e2f5213063d.png" alt="실행 구성 app → 기기 선택 → Run ▶: 공식 개발 도구 화면 예시" loading="lazy"><span class="click-target" aria-hidden="true" style="left:24%;top:0%;width:16%;height:8%"><span>여기를 선택</span></span></div><p class="success"><b>완료 확인</b> 아래 Build가 진행되고 잠시 뒤 가상 폰에 앱이 열려요. Run을 여러 번 연속 누를 필요는 없어요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="window-build"><figcaption><span class="step-num">A10</span><strong>Build Output에서 조립 성공 확인</strong></figcaption><p class="action"><b>할 일</b> View → Tool Windows → Build를 열어요. Build Output 탭을 선택하고 마지막 결과를 확인합니다.</p><div class="shot"><img src="study-assets/7fef3c3379e9367ef0a4.png" alt="Build Output에서 조립 성공 확인: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> BUILD SUCCESSFUL 또는 빌드 성공 표시가 보이면 조립은 성공했어요. 그다음 폰의 실제 화면도 확인해야 실행까지 확인한 것입니다.</p><p>원본 그림의 프로젝트 이름·작업 수·시간은 예시예요. 같은 숫자가 나올 필요는 없습니다. 빌드 성공은 모든 기능이 맞다는 뜻은 아니므로 버튼도 직접 눌러 보세요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/run">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card" data-guide="layout-editor"><figcaption><span class="step-num">A11</span><strong>activity_main.xml 열고 Code 또는 Split 선택</strong></figcaption><p class="action"><b>할 일</b> 왼쪽 app → res → layout → activity_main.xml 두 번 클릭. 편집기 오른쪽 위 Code(코드) 또는 Split(분할) 모드를 선택해요.</p><div class="shot"><img src="study-assets/00dfbf52d382561fa84d.png" alt="activity_main.xml 열고 Code 또는 Split 선택: 공식 개발 도구 화면 예시" loading="lazy"></div><p class="success"><b>완료 확인</b> XML 글자를 입력할 수 있는 영역이 보여요. Design만 열려 있으면 코드 입력 영역이 없을 수 있어요.</p><p class="credit">원본 화면: <a href="https://developer.android.com/studio/views/layout-editor">Google Android Developers 문서</a>. 원본 화면 위에 교재의 안내 표시를 겹쳐 두었습니다. 운영체제·버전에 따라 아이콘 위치와 예시 값은 달라질 수 있어요.</p></figure><figure class="tool-card key-card"><figcaption><span class="step-num">A12</span><strong>XML 수정 → 저장 → Run</strong></figcaption><div class="keyboard"><kbd>android:text 변경</kbd><kbd>Ctrl + S</kbd><kbd>Run ▶</kbd></div><p class="action">따옴표 안의 제목만 바꾸고 저장하세요. Preview에서 확인한 뒤 Run으로 폰의 실제 화면도 봅니다.</p><p class="success"><b>완료 확인</b> 수정한 제목이 폰에서 보입니다. 미리보기 성공과 기기 실행 성공을 각각 확인해요.</p><p class="credit">키보드 조작을 설명하는 교재용 그림입니다. 실제 프로그램 화면 캡처는 아닙니다.</p></figure><script>
document.querySelectorAll('a[href="#toc"]').forEach(a=>a.addEventListener('click',()=>{const panel=document.querySelector('#toc .toc-panel');if(panel)panel.open=true;}));
document.querySelectorAll('.toc-panel').forEach(panel=>panel.addEventListener('toggle',()=>{const label=panel.querySelector('.toc-label');if(label)label.textContent=panel.open?'전체 목차 접기':'전체 목차 펼치기';}));
document.querySelectorAll('.tool-card .shot').forEach(shot=>{const button=document.createElement('button');button.type='button';button.className='zoom';button.textContent='화면 크게 보기';shot.after(button);button.addEventListener('click',()=>{const dialog=document.createElement('dialog');dialog.className='image-dialog';const close=document.createElement('button');close.type='button';close.className='close-image';close.textContent='닫기 (Esc)';const area=document.createElement('div');area.className='image-scroll';const enlarged=shot.cloneNode(true);enlarged.style.width='1400px';enlarged.style.position='relative';enlarged.querySelector('img').loading='eager';area.append(enlarged);dialog.append(close,area);document.body.append(dialog);close.addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{dialog.remove();button.focus();});dialog.showModal();});});
