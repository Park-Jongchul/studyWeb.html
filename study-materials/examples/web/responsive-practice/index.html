<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마음쉼 상담실 · 반응형 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="container">
    <h1>마음쉼 상담실</h1>
    <nav class="menu" aria-label="주요 메뉴">
      <a href="#services">상담 안내</a><a href="#intro">상담실 소개</a><a href="#contact">문의 방법</a>
    </nav>
  </header>
  <main class="container">
    <section id="intro"><h2>내 화면에 맞는 상담 안내</h2>
      <p>휴대전화에서는 한 줄에 하나, 넓은 화면에서는 여러 카드를 보여 줍니다.</p>
      <img class="hero-image" src="room.svg" alt="상담실을 나타낸 연습 그림" width="1000" height="320">
    </section>
    <section id="services"><h2>상담 종류</h2><div class="cards">
      <article class="card"><h3>개인 상담</h3><p>나의 감정과 고민을 천천히 살펴봅니다.</p><a class="button" href="#contact">문의 방법 보기</a></article>
      <article class="card"><h3>진로 상담</h3><p>일과 진로에 관한 선택을 함께 정리합니다.</p><a class="button" href="#contact">문의 방법 보기</a></article>
      <article class="card"><h3>관계 상담</h3><p>대화와 관계의 어려움을 이야기합니다.</p><a class="button" href="#contact">문의 방법 보기</a></article>
    </div></section>
    <section id="contact"><h2>문의 방법</h2><p>실제 상담을 접수하지 않는 반응형 화면 연습입니다.</p></section>
  </main>
</body>
</html>
