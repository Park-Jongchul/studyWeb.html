<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음쉼 · 상담 웹 연습</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.8 system-ui; background: #f5f7f2; color: #183d35; }
main { width: min(100% - 32px, 800px); margin: 40px auto; }
section { background: white; padding: 24px; border-radius: 16px; margin: 20px 0; }
label { display: block; margin-top: 16px; }
input, select, button { font: inherit; padding: 10px; max-width: 100%; }
button { background: #155f51; color: white; border: 0; border-radius: 8px; cursor: pointer; }
:focus-visible { outline: 3px solid #c57900; outline-offset: 3px; }
li { margin: 12px 0; }
</style>
</head>
<body>
<main>
  <h1>마음쉼 상담실</h1>
  <p>당신의 이야기를 천천히 듣습니다. 가상의 상담실 소개입니다.</p>
  <section><h2>상담 안내</h2><p>개인 상담 50분 / 진로 상담 40분</p></section>
  <section>
    <h2>희망 시간 연습</h2>
    <p>실제 예약이 아닙니다. 가상 별명만 입력하세요. 데이터는 전송되지 않습니다.</p>
    <form id="form">
      <label for="nickname">연습용 별명</label><input id="nickname" required maxlength="20">
      <label for="service">서비스</label>
      <select id="service"><option>개인 상담</option><option>진로 상담</option></select>
      <label for="slot">희망 시간</label>
      <select id="slot"><option>10:00</option><option>14:00</option><option>16:00</option></select>
      <p><button type="submit">희망 내용 확인</button></p>
    </form>
    <p id="message" role="status"></p>
    <ul id="list" aria-label="연습용 희망 목록"></ul>
  </section>
</main>
<script>
const requests = [];
const form = document.querySelector("#form");
const list = document.querySelector("#list");
const message = document.querySelector("#message");
function render() {
  list.replaceChildren();
  requests.forEach((request, index) => {
    const item = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = `${request.nickname} · ${request.service} · ${request.slot} (연습) `;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "삭제";
    remove.setAttribute("aria-label", request.nickname + " 연습 항목 삭제");
    remove.addEventListener("click", () => {
      requests.splice(index, 1);
      render();
      message.textContent = "연습 항목을 삭제했어요.";
      form.querySelector("input").focus();
    });
    item.append(text, remove);
    list.append(item);
  });
}
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const nickname = document.querySelector("#nickname").value.trim();
  if (nickname === "") {
    message.textContent = "공백 외에 별명을 적어 주세요.";
    return;
  }
  const service = document.querySelector("#service").value;
  const slot = document.querySelector("#slot").value;
  requests.push({ nickname, service, slot });
  render();
  message.textContent = "화면에만 추가했어요. 실제 예약은 접수되지 않았어요.";
  form.reset();
});
</script>
</body>
</html>
