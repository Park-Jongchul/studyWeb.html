<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C17 · 이제 읽을 수 있는 .card</title>
  <style>
.card {
  margin: 16px 0;
  padding: 20px;
  border: 1px solid #bdd6c6;
  border-radius: 12px;
  background-color: #eef5ef;
}
</style>
</head>
<body>
<article class="card">
  <h2>개인 상담</h2>
  <p>한 사람의 이야기를 듣는 시간입니다.</p>
</article>
<article class="card">
  <h2>진로 상담</h2>
  <p>일과 진로의 선택을 정리합니다.</p>
</article>
</body>
</html>
