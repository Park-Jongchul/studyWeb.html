<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C16 · p 모두와 이름표가 있는 p 하나</title>
  <style>
p {
  color: #24332c;
}
.notice {
  color: #9b2e13;
  background-color: #fff2cc;
  padding: 16px;
  border: 1px solid #b26a00;
}
</style>
</head>
<body>
<h1>문의 전 안내</h1>
<p>편한 마음으로 읽어 주세요.</p>
<p class="notice">실제 상담을 접수하지 않는 연습 화면입니다.</p>
<p>다음에는 버튼 동작을 배웁니다.</p>
</body>
