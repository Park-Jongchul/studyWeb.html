  <title>H04 · 중요한 말과 강조한 말</title>

<body>
<h1>예약 안내</h1>
<p><strong>이 화면은 실제 예약을 접수하지 않습니다.</strong></p>
<p>처음 오셔도 <em>천천히</em> 이야기하셔도 됩니다.</p>
<p>상담 전 <strong><em>연습 안내</em></strong>를 읽어 주세요.</p>
