<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H12 · 읽고 입력할 수 있는 폼</title>
  
</head>
<body>
<h1>문의 모양 연습</h1>
<form>
  <p><label for="nickname">가상 이름</label><br><input id="nickname" name="nickname" type="text" placeholder="연습 이름"></p>
  <p><label for="email">이메일 모양</label><br><input id="email" name="email" type="email"></p>
  <p><label for="topic">관심 분야</label><br><select id="topic" name="topic"><option>개인 상담</option><option>진로 상담</option></select></p>
  <p><label for="memo">메모</label><br><textarea id="memo" name="memo" rows="3"></textarea></p>
  <p><label><input type="checkbox" name="practice">학습용 화면임을 확인했습니다.</label></p>
  <button type="button">아직 전송하지 않는 연습 버튼</button>
</form>
</body>
</html>
